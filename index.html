<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖥️ СОБЕРИ ПК | Пазл-Челлендж</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Rajdhani', sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #2d1b69 100%);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    padding: 20px;
  }
  
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  
  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    background: linear-gradient(90deg, #00f0ff, #ff00e5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  
  .subtitle {
    font-size: 1.3rem;
    color: #b8bcff;
    letter-spacing: 0.2em;
  }
  
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  
  .stat-card {
    background: rgba(0,240,255,0.1);
    border: 2px solid #00f0ff;
    border-radius: 15px;
    padding: 15px 30px;
    min-width: 150px;
    text-align: center;
  }
  
  .stat-label {
    font-size: 0.9rem;
    color: #b8bcff;
    text-transform: uppercase;
  }
  
  .stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    color: #00f0ff;
    margin-top: 5px;
  }
  
  .stat-value.timer { color: #ff00e5; }
  .stat-value.moves { color: #ffd700; }
  
  .game-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 30px;
  }
  
  @media (max-width: 900px) {
    .game-area { grid-template-columns: 1fr; }
  }
  
  .panel {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 25px;
  }
  
  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem;
    color: #00f0ff;
    margin-bottom: 20px;
    text-align: center;
  }
  
  .puzzle-container {
    position: relative;
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
  }
  
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    background: #1a1f4e;
    border: 3px solid #00f0ff;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 4/3;
  }
  
  .puzzle-cell {
    aspect-ratio: 4/3;
    background: #0a0e27;
    border: 2px dashed rgba(255,255,255,0.2);
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    color: #444;
  }
  
  .puzzle-cell:hover {
    border-color: #00f0ff;
    background: rgba(0,240,255,0.1);
  }
  
  .puzzle-cell.filled {
    border: 2px solid #00f0ff;
    background: #1a1f4e;
  }
  
  .puzzle-cell.correct {
    border-color: #00ff88;
    box-shadow: inset 0 0 10px rgba(0,255,136,0.3);
  }
  
  .pieces-pool {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 450px;
    margin: 0 auto;
  }
  
  .piece-item {
    aspect-ratio: 4/3;
    border: 2px solid #ff00e5;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    background: #1a1f4e;
    position: relative;
    overflow: hidden;
  }
  
  .piece-item:hover {
    transform: scale(1.05);
    border-color: #ffd700;
    box-shadow: 0 0 15px rgba(255,0,229,0.5);
  }
  
  .piece-item.selected {
    border-color: #ffd700;
    box-shadow: 0 0 25px rgba(255,215,0,0.8);
    transform: scale(1.1);
  }
  
  .piece-item.placed {
    opacity: 0.2;
    pointer-events: none;
  }
  
  .piece-number {
    position: absolute;
    top: 3px;
    left: 3px;
    background: rgba(0,0,0,0.8);
    color: #00f0ff;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    z-index: 10;
  }
  
  /* SVG IMAGES FOR PIECES */
  .piece-img {
    width: 100%;
    height: 100%;
    background-size: 300% 300%;
  }
  
  .controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  
  .btn {
    font-family: 'Orbitron', sans-serif;
    padding: 15px 30px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    transition: all 0.3s;
  }
  
  .btn-primary {
    background: linear-gradient(90deg, #00f0ff, #00cc6a);
    color: #0a0e27;
    box-shadow: 0 5px 20px rgba(0,240,255,0.4);
  }
  
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,240,255,0.6);
  }
  
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
  }
  
  .btn-secondary:hover {
    background: rgba(255,255,255,0.2);
    border-color: #ff00e5;
  }
  
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  
  .modal.active {
    display: flex;
    animation: fadeIn 0.5s;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .modal-content {
    background: linear-gradient(135deg, #1a1f4e, #2d1b69);
    border: 3px solid #00f0ff;
    border-radius: 25px;
    padding: 40px;
    max-width: 500px;
    text-align: center;
    animation: slideUp 0.5s;
  }
  
  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  .modal-icon {
    font-size: 5rem;
    margin-bottom: 20px;
    animation: bounce 1s infinite;
  }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  
  .modal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    color: #00f0ff;
    margin-bottom: 20px;
  }
  
  .modal-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 30px 0;
  }
  
  .modal-stat {
    background: rgba(0,240,255,0.1);
    border-radius: 10px;
    padding: 15px;
  }
  
  .modal-stat-label {
    font-size: 0.9rem;
    color: #b8bcff;
  }
  
  .modal-stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    color: #ffd700;
    margin-top: 5px;
  }
  
  .hint-box {
    background: rgba(255,215,0,0.1);
    border: 2px solid #ffd700;
    border-radius: 15px;
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  
  .hint-title {
    color: #ffd700;
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 class="title">️ СОБЕРИ ПК</h1>
    <p class="subtitle">ПАЗЛ-ЧЕЛЛЕНДЖ • 9 ФРАГМЕНТОВ</p>
  </div>
  
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">⏱️ Время</div>
      <div class="stat-value timer" id="timer">00:00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🎯 Ходы</div>
      <div class="stat-value moves" id="moves">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">✅ Собрано</div>
      <div class="stat-value" id="progress">0/9</div>
    </div>
  </div>
  
  <div class="game-area">
    <div class="panel">
      <div class="panel-title"> Поле сборки</div>
      <div class="puzzle-container">
        <div class="puzzle-grid" id="puzzleGrid"></div>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-title">🧩 Фрагменты</div>
      <div class="pieces-pool" id="piecesPool"></div>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startGame()">🚀 Новая игра</button>
    <button class="btn btn-secondary" onclick="showHint()">💡 Подсказка</button>
    <button class="btn btn-secondary" onclick="resetGame()">🔄 Сброс</button>
  </div>
  
  <div class="hint-box" id="hintBox">
    <div class="hint-title">💡 ПОДСКАЗКА</div>
    <p>Собери настольный компьютер: монитор, системный блок, клавиатура и мышь</p>
  </div>
</div>

<!-- WIN MODAL -->
<div class="modal" id="winModal">
  <div class="modal-content">
    <div class="modal-icon">🏆</div>
    <h2 class="modal-title">ПОБЕДА!</h2>
    <p>Ты собрал компьютер!</p>
    <div class="modal-stats">
      <div class="modal-stat">
        <div class="modal-stat-label">Время</div>
        <div class="modal-stat-value" id="finalTime">00:00</div>
      </div>
      <div class="modal-stat">
        <div class="modal-stat-label">Ходы</div>
        <div class="modal-stat-value" id="finalMoves">0</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="closeModal(); startGame();">Играть снова</button>
  </div>
</div>

<script>
// SVG IMAGE AS BASE64
const pcImage = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgMzAwIj48cmVjdCBmaWxsPSIjZjBmMGYwIiB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIvPjxyZWN0IGZpbGw9IiMzMzMiIHg9IjMwIiB5PSIyMCIgd2lkdGg9IjIyMCIgaGVpZ2h0PSIxNTAiIHJ4PSI1Ii8+PHJlY3QgZmlsbD0iIzExMSIgeD0iNDAiIHk9IjMwIiB3aWR0aD0iMjAwIiBoZWlnaHQ9IjEzMCIvPjxyZWN0IGZpbGw9IiM1NTUiIHg9IjE0MCIgeT0iMTcwIiB3aWR0aD0iMjAiIGhlaWdodD0iMzAiLz48cmVjdCBmaWxsPSIjMzMzIiB4PSIxMTAiIHk9IjIwMCIgd2lkdGg9IjgwIiBoZWlnaHQ9IjEwIiByeD0iMyIvPjxyZWN0IGZpbGw9IiNjY2MiIHg9IjI4MCIgeT0iMjAiIHdpZHRoPSI5MCIgaGVpZ2h0PSIyMjAiIHJ4PSI1Ii8+PHJlY3QgZmlsbD0iIzk5OSIgeD0iMjkwIiB5PSIzMCIgd2lkdGg9IjcwIiBoZWlnaHQ9IjIwIiByeD0iMiIvPjxyZWN0IGZpbGw9IiM5OTkiIHg9IjI5MCIgeT0iNjAiIHdpZHRoPSI3MCIgaGVpZ2h0PSIyMCIgcng9IjIiLz48cmVjdCBmaWxsPSIjOTk5IiB4PSIyOTAiIHk9IjkwIiB3aWR0aD0iNzAiIGhlaWdodD0iMjAiIHJ4PSIyIi8+PHJlY3QgZmlsbD0iIzY2NiIgeD0iMjkwIiB5PSIxMjAiIHdpZHRoPSI3MCIgaGVpZ2h0PSIxMDAiIHJ4PSIzIi8+PHJlY3QgZmlsbD0iIzMzMyIgeD0iMzEwIiB5PSIxNjAiIHdpZHRoPSIzMCIgaGVpZ2h0PSIzMCIgcng9IjIiLz48cmVjdCBmaWxsPSIjZGQ0IiB4PSI1MCIgeT0iMjMwIiB3aWR0aD0iMTgwIiBoZWlnaHQ9IjU1IiByeD0iNCIvPjxyZWN0IGZpbGw9IiMzMzMiIHg9IjYwIiB5PSIyNDAiIHdpZHRoPSIxNjAiIGhlaWdodD0iMzUiIHJ4PSIyIi8+PHJlY3QgZmlsbD0iI2RkZCIgeD0iMjcwIiB5PSIyNTAiIHdpZHRoPSI1MCIgaGVpZ2h0PSIzNSIgcng9IjE1Ii8+PC9zdmc+';

// GAME STATE
let selectedPiece = null;
let moves = 0;
let seconds = 0;
let timerInterval = null;
let placedPieces = new Set();
let gameStarted = false;

// PIECE POSITIONS
const piecePositions = [
  { x: 0, y: 0 }, { x: 50, y: 0 }, { x: 100, y: 0 },
  { x: 0, y: 50 }, { x: 50, y: 50 }, { x: 100, y: 50 },
  { x: 0, y: 100 }, { x: 50, y: 100 }, { x: 100, y: 100 }
];

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  moves = 0;
  seconds = 0;
  placedPieces.clear();
  selectedPiece = null;
  gameStarted = true;
  
  updateStats();
  startTimer();
  renderGrid();
  renderPieces();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    seconds++;
    const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
    const secs = (seconds % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${mins}:${secs}`;
  }, 1000);
}

function updateStats() {
  document.getElementById('moves').textContent = moves;
  document.getElementById('progress').textContent = `${placedPieces.size}/9`;
}

function renderGrid() {
  const grid = document.getElementById('puzzleGrid');
  grid.innerHTML = '';
  
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'puzzle-cell';
    cell.dataset.index = i;
    cell.onclick = () => handleCellClick(i);
    
    if (placedPieces.has(i)) {
      cell.classList.add('filled', 'correct');
      const img = document.createElement('div');
      img.className = 'piece-img';
      img.style.backgroundImage = `url(${pcImage})`;
      img.style.backgroundPosition = `${piecePositions[i].x}% ${piecePositions[i].y}%`;
      cell.appendChild(img);
    }
    
    grid.appendChild(cell);
  }
}

function renderPieces() {
  const pool = document.getElementById('piecesPool');
  pool.innerHTML = '';
  
  const shuffled = shuffle([0,1,2,3,4,5,6,7,8]);
  
  shuffled.forEach((pieceIndex) => {
    const item = document.createElement('div');
    item.className = 'piece-item';
    item.dataset.pieceIndex = pieceIndex;
    item.onclick = () => handlePieceClick(pieceIndex, item);
    
    if (placedPieces.has(pieceIndex)) {
      item.classList.add('placed');
    }
    
    if (selectedPiece === pieceIndex) {
      item.classList.add('selected');
    }
    
    const img = document.createElement('div');
    img.className = 'piece-img';
    img.style.backgroundImage = `url(${pcImage})`;
    img.style.backgroundPosition = `${piecePositions[pieceIndex].x}% ${piecePositions[pieceIndex].y}%`;
    item.appendChild(img);
    
    const num = document.createElement('div');
    num.className = 'piece-number';
    num.textContent = pieceIndex + 1;
    item.appendChild(num);
    
    pool.appendChild(item);
  });
}

function handlePieceClick(pieceIndex, element) {
  if (placedPieces.has(pieceIndex)) return;
  
  selectedPiece = selectedPiece === pieceIndex ? null : pieceIndex;
  renderPieces();
}

function handleCellClick(cellIndex) {
  if (!gameStarted || placedPieces.has(cellIndex) || selectedPiece === null) return;
  
  placedPieces.add(selectedPiece);
  moves++;
  selectedPiece = null;
  
  updateStats();
  renderGrid();
  renderPieces();
  
  if (placedPieces.size === 9) {
    setTimeout(checkWin, 500);
  }
}

function checkWin() {
  clearInterval(timerInterval);
  
  const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
  const secs = (seconds % 60).toString().padStart(2, '0');
  document.getElementById('finalTime').textContent = `${mins}:${secs}`;
  document.getElementById('finalMoves').textContent = moves;
  document.getElementById('winModal').classList.add('active');
}

function showHint() {
  const hint = document.getElementById('hintBox');
  hint.style.display = hint.style.display === 'none' || hint.style.display === '' ? 'block' : 'none';
}

function resetGame() {
  placedPieces.clear();
  selectedPiece = null;
  moves = 0;
  updateStats();
  renderGrid();
  renderPieces();
}

function closeModal() {
  document.getElementById('winModal').classList.remove('active');
}

// INIT
renderGrid();
renderPieces();
</script>

</body>
</html>
